# The MCUScript conformance corpus.
#
# Each case is a container and the verdict a conforming loader
# must give it. See README.md in this directory.
#
# Generated by mcuscript from tools/src/mcuscript/corpus.py.
# Do not edit.

profile_id = 1
profile_major = 0
profile_minor = 0

[[case]]
name = "ok-minimal"
file = "ok-minimal.mcs"
stage = "ok"
refusal = ""
description = "One entry point that returns immediately. The smallest thing a loader must accept."

[[case]]
name = "ok-worked-example"
file = "ok-worked-example.mcs"
stage = "ok"
refusal = ""
host = "ok-worked-example.host"
description = "The threshold ladder of specification §3.9, with the imports it reads and writes."

[[case]]
name = "ok-every-group"
file = "ok-every-group.mcs"
stage = "ok"
refusal = ""
description = "One container that requires every instruction group with instructions in it: i64, float, call and bits alongside core."

[[case]]
name = "ok-capped-recursion"
file = "ok-capped-recursion.mcs"
stage = "ok"
refusal = ""
description = "A cycle in the call graph with a declared cap — accepted at load, bounded at run time (§5.4)."

[[case]]
name = "bad-magic"
file = "bad-magic.mcs"
stage = "container"
refusal = "bad_magic"
description = "The first four bytes are not MCUS."

[[case]]
name = "unsupported-format-version"
file = "unsupported-format-version.mcs"
stage = "container"
refusal = "unsupported_format_version"
description = "The header claims format version 2. A reader refuses anything above the version it implements rather than guessing."

[[case]]
name = "length-mismatch"
file = "length-mismatch.mcs"
stage = "container"
refusal = "length_mismatch"
description = "total_length is one byte more than the file."

[[case]]
name = "bad-checksum"
file = "bad-checksum.mcs"
stage = "container"
refusal = "bad_checksum"
description = "Everything is well-formed and the stored CRC is wrong — so this is the one case that must not be repaired before it is checked."

[[case]]
name = "malformed-section"
file = "malformed-section.mcs"
stage = "container"
refusal = "malformed_section"
description = "A section declares more bytes than the container holds."

[[case]]
name = "unknown-critical-section"
file = "unknown-critical-section.mcs"
stage = "container"
refusal = "unknown_critical_section"
description = "A section whose type starts with an uppercase letter and which this format version does not define. Lowercase would be ancillary and carried through untouched (§2.3)."

[[case]]
name = "missing-section"
file = "missing-section.mcs"
stage = "container"
refusal = "missing_section"
description = "HOST is absent. All four critical sections are mandatory; an empty table is a count of zero, not an absent section."

[[case]]
name = "duplicate-section"
file = "duplicate-section.mcs"
stage = "container"
refusal = "duplicate_section"
description = "CNST appears twice."

[[case]]
name = "reserved-field-set"
file = "reserved-field-set.mcs"
stage = "container"
refusal = "reserved_field_set"
description = "The header's flags field is not zero. Every bit of it is reserved in version 1, and a reader that ignored one would accept a container written for a version it does not know."

[[case]]
name = "entry-takes-parameters"
file = "entry-takes-parameters.mcs"
stage = "container"
refusal = "entry_takes_parameters"
description = "An invocable record declares a parameter. The host has no way to pass one, and the two backends would disagree about what an unsupplied one holds (§4.3)."

[[case]]
name = "profile-mismatch"
file = "profile-mismatch.mcs"
stage = "compatibility"
refusal = "profile_mismatch"
description = "Compiled against a different profile. A changed base unit makes existing bytecode silently wrong, so this is a refusal rather than arithmetic on wrongly scaled numbers (§1.4)."

[[case]]
name = "unsupported-group"
file = "unsupported-group.mcs"
stage = "compatibility"
refusal = "unsupported_group"
description = "The header requires the reserved `loop` group, which no implementation has. The check reads the header, not the code — which is what lets a build without float say no at load rather than meet a float opcode at run time."

[[case]]
name = "undefined-opcode"
file = "undefined-opcode.mcs"
stage = "verification"
refusal = "undefined_opcode"
description = "Opcode 0x00, which is deliberately unassigned so that a run of erased flash is refused rather than executed (§3.1)."

[[case]]
name = "opcode-outside-the-required-groups"
file = "opcode-outside-the-required-groups.mcs"
stage = "verification"
refusal = "undefined_opcode"
description = "add.i64 in a container whose header requires only `core`. The opcode is assigned, and a complete build implements it — but §2.6 point 1 asks whether it is in a group the *container* required, and it is not. Without this the header could under-declare, and the header is the whole of what lets a narrowed build refuse a container before meeting an instruction it does not have (§2.5)."

[[case]]
name = "truncated-instruction"
file = "truncated-instruction.mcs"
stage = "verification"
refusal = "truncated_instruction"
description = "const.i32.s16 needs three bytes and two remain."

[[case]]
name = "bad-branch-target"
file = "bad-branch-target.mcs"
stage = "verification"
refusal = "bad_branch_target"
description = "A branch into the middle of an instruction — the classic verifier bypass. Both readings are individually well-typed: the immediate of `const.i32.s16 1281` is itself a valid `const.i32.s8 5`, both push one i32 and both fall into the same `drop`. Only counting how often each byte is decoded distinguishes this from honest code (§2.6.1)."

[[case]]
name = "branch-past-the-end"
file = "branch-past-the-end.mcs"
stage = "verification"
refusal = "bad_branch_target"
description = "A branch to an offset outside the function's own code region."

[[case]]
name = "backward-branch"
file = "backward-branch.mcs"
stage = "verification"
refusal = "backward_branch"
description = "A jump to itself. Backward jumps are rejected in specification version 0.1, which is what makes termination provable at load and removes the need for an execution budget (§3.8, §5.6)."

[[case]]
name = "unreachable-code"
file = "unreachable-code.mcs"
stage = "verification"
refusal = "unreachable_code"
description = "A byte after the return that no path reaches. Not a safety problem — it cannot execute — but a container should mean one thing, and a dead byte is an encoder bug or something smuggled in."

[[case]]
name = "unreachable-function"
file = "unreachable-function.mcs"
stage = "verification"
refusal = "unreachable_code"
description = "The same rule one level up: a function no entry point reaches. A VM would never notice; a C backend turns functions into file-local symbols and a C compiler rejects one nobody calls, so this is a container only one backend can express."

[[case]]
name = "type-mismatch"
file = "type-mismatch.mcs"
stage = "verification"
refusal = "type_mismatch"
description = "add.i32 applied to two bools."

[[case]]
name = "stack-underflow"
file = "stack-underflow.mcs"
stage = "verification"
refusal = "stack_underflow"
description = "add.i32 with an empty stack."

[[case]]
name = "inconsistent-join"
file = "inconsistent-join.mcs"
stage = "verification"
refusal = "inconsistent_join"
description = "Two paths reach one instruction with different stack shapes. This is what makes the untagged slots of §1.2 safe: if the type at every position is the same by every route, the runtime never has to ask."

[[case]]
name = "unbalanced-return"
file = "unbalanced-return.mcs"
stage = "verification"
refusal = "unbalanced_return"
description = "A function that returns nothing, returning with a value still on the stack."

[[case]]
name = "stack-depth-mismatch"
file = "stack-depth-mismatch.mcs"
stage = "verification"
refusal = "stack_depth_mismatch"
description = "The code needs one slot and the record claims ninety-nine. The VM allocates from that number, so the verifier recomputes it rather than asking whether it is plausible (§2.6)."

[[case]]
name = "call-depth-mismatch"
file = "call-depth-mismatch.mcs"
stage = "verification"
refusal = "call_depth_mismatch"
description = "The recomputed worst-case frame count differs from the declared one."

[[case]]
name = "uncapped-recursion"
file = "uncapped-recursion.mcs"
stage = "verification"
refusal = "uncapped_recursion"
description = "A function that calls itself with no declared cap. The cap is the one number a verifier cannot derive — it is a decision the author made — so its absence is a refusal (§5.4)."

[[case]]
name = "recursion-cap-mismatch"
file = "recursion-cap-mismatch.mcs"
stage = "verification"
refusal = "recursion_cap_mismatch"
description = "A cap on a function that is in no cycle. A number that bounds nothing reads as a safeguard and is not."

[[case]]
name = "index-out-of-range"
file = "index-out-of-range.mcs"
stage = "verification"
refusal = "index_out_of_range"
description = "const.i32 addresses a constant pool that is empty."

[[case]]
name = "kind-mismatch"
file = "kind-mismatch.mcs"
stage = "verification"
refusal = "kind_mismatch"
description = "load.h addresses a host *function*. An entity is not a function, and the container's own table says so before any registry is consulted."

[[case]]
name = "access-denied"
file = "access-denied.mcs"
stage = "verification"
refusal = "access_denied"
description = "store.h targets an entity the container itself declares read-only."

[[case]]
name = "duplicate-import"
file = "duplicate-import.mcs"
stage = "container"
refusal = "duplicate_import"
description = "Two HOST records name the same entity. Not a harmless redundancy: the two records can declare different types, and then one name has two contradictory contracts inside one program."

[[case]]
name = "unknown-import"
file = "unknown-import.mcs"
stage = "linking"
refusal = "unknown_import"
host = "unknown-import.host"
description = "The container reads an entity the registry does not have. There is no partial link and no deferring the question to first use: a script that refers to something absent must not start (§4.5)."

[[case]]
name = "import-type-mismatch"
file = "import-type-mismatch.mcs"
stage = "linking"
refusal = "import_type_mismatch"
host = "import-type-mismatch.host"
description = "The container declares i32 and the registry offers i64."

[[case]]
name = "dimension-mismatch"
file = "dimension-mismatch.mcs"
stage = "linking"
refusal = "dimension_mismatch"
host = "dimension-mismatch.host"
description = "Same name, same type, different dimension — the script was compiled against a different world and its numbers would be wrong by a scale factor. The header catches a wholesale profile change; this catches the one entity that moved (§4.4)."

[[case]]
name = "signature-mismatch"
file = "signature-mismatch.mcs"
stage = "linking"
refusal = "signature_mismatch"
host = "signature-mismatch.host"
description = "A host function the container calls with one argument and the registry declares with two."
