# A plausible home profile — the one the front end's tests compile
# against. The numbers exercise the awkward cases rather than recommend
# anything: temperature is held in hundredths of a degree so that
# 24.5°C is exact and 24.555°C is not, and °F carries an offset.

format = 1

[profile]
name = "home"
id = 1
version = "0.1"

[dimension.temperature]
id = 1
type = "i32"
base_unit = "c°C"

[dimension.temperature.units]
"c°C" = 1
"°C" = 100
# 1 °F is 5/9 °C, and the scale starts 32 °F lower.
"°F" = { factor = "500/9", offset = "-16000/9" }

[dimension.humidity]
id = 2
type = "i32"
base_unit = "d%"

[dimension.humidity.units]
"d%" = 1
"%" = 10

[dimension.duration]
id = 3
type = "i32"
base_unit = "ms"

[dimension.duration.units]
ms = 1
s = 1000
min = 60000
h = 3600000
d = 86400000

# A scale factor (§6.5.5.1): a pure ratio whose units are multipliers.
[dimension.ratio]
id = 4
type = "f32"
base_unit = "one"
scale = true

[dimension.ratio.units]
one = 1
pct = "1/100"
ppm = "1/1000000"

# A clock, so that a literal carrying a date has somewhere to belong.
[dimension.instant]
id = 5
type = "i64"
base_unit = "ms_utc"
calendar = { epoch = "1970-01-01 00:00:00", second = 1000 }
# No units: a base unit need not be spelled, and no suffix could spell
# this one anyway (§6.1.5 has no `_`). The way into this dimension is a
# literal carrying a date.

# A dimension whose values wrap (§6.5.6): milliseconds since the device
# started, held in an i32, so it returns to its start after 49.7 days.
[dimension.uptime]
id = 6
type = "i32"
base_unit = "ms_up"
cyclic = true

# The other calendar role: no epoch, so this is where a time of day
# lands, counted from midnight (§7.2.4).
[dimension.daytime]
id = 7
type = "i32"
base_unit = "s_day"
calendar = { second = 1 }
