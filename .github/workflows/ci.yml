#
# CI for MCUScript. One gate today, because there is no implementation:
#
#   lint  — the same pre-commit hooks a contributor runs locally
#           (whitespace, YAML/TOML, codespell, REUSE compliance).
#
# A build and a test gate are added in the same commit that introduces
# the first source file. All actions are pinned to commit SHAs, not tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      # `--all-files` runs the tree hooks only. The Conventional Commits
      # hook is a commit-msg hook: it checks a message, not a tree, and
      # runs locally via `pre-commit install --hook-type commit-msg`.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
