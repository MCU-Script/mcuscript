#
# CI for MCUScript.
#
#   lint   — the same pre-commit hooks a contributor runs locally
#            (whitespace, YAML/TOML, codespell, REUSE, ruff).
#   tools  — the host toolchain's test suite, on the oldest and the
#            newest Python the project supports. Both, because the
#            oldest is what the floor in pyproject.toml claims and the
#            newest is what a contributor will actually have. It builds
#            the C runtime too and drives it, which is where the two
#            implementations meet.
#   runtime — the runtime on its own, under gcc and clang, warnings as
#            errors. Two compilers because a C99 runtime that only
#            builds under one of them is not portable, it is lucky.
#
# All actions are pinned to commit SHAs, not tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      # `--all-files` runs the tree hooks only. The Conventional Commits
      # hook is a commit-msg hook: it checks a message, not a tree, and
      # runs locally via `pre-commit install --hook-type commit-msg`.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  tools:
    name: Toolchain (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --disable-pip-version-check -e "tools[dev]"

      - name: pytest
        run: python -m pytest tools/tests -q

  runtime:
    name: Runtime (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S runtime -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: ctest
        run: ctest --test-dir build --output-on-failure
